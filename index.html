<!DOCTYPE html>
<html lang="az" style="background-color: #161618; height: 100%; width: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mintu Studio</title>
    <link rel="stylesheet" href="/src/styles/studio.css" />
  </head>
  <body style="background-color: #161618; color: #ECEEF2; height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden;">
    <div id="studio-root">
      <!-- Custom Dark Top Bar (Title Bar) -->
      <header class="studio-topbar" data-tauri-drag-region>
        <div class="topbar-left" data-tauri-drag-region>
          <div class="studio-brand" data-tauri-drag-region>
            <svg width="18" height="16" viewBox="0 0 28 24" fill="none" aria-hidden="true">
              <path d="M2.5 21V5.2C2.5 3.3 4.7 2.2 6.2 3.4L14 9.8L21.8 3.4C23.3 2.2 25.5 3.3 25.5 5.2V21H21.2V10.1L14 15.8L6.8 10.1V21H2.5Z" fill="currentColor"/>
            </svg>
            <span class="studio-brand-name">Mintu Studio</span>
          </div>

          <button type="button" id="btn-project-dropdown" class="topbar-dropdown-btn" title="Layihə qovluğu menyusu">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <span id="current-project-label">Qovluq Aç</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
        </div>

        <div class="topbar-center">
          <div class="topbar-search-box">
            <svg class="topbar-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
              <circle cx="11" cy="11" r="7.5"/>
              <line x1="20" y1="20" x2="16.4" y2="16.4"/>
            </svg>
            <input
              id="studio-search-input"
              class="topbar-search-input"
              type="text"
              placeholder="Axtar... Ctrl+Shift+F"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
        </div>

        <div class="topbar-right">
          <button type="button" id="btn-model-selector" class="topbar-model-btn" title="Aktiv AI modelini dəyiş">
            <span id="topbar-model-label">Lokal</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          <button type="button" id="btn-topbar-settings" class="studio-btn-icon" title="Tənzimləmələr">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>

          <div class="window-controls">
            <button type="button" id="btn-win-min" class="win-ctrl-btn" title="Kiçilt">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
                <line x1="1" y1="6" x2="11" y2="6"/>
              </svg>
            </button>
            <button type="button" id="btn-win-max" class="win-ctrl-btn" title="Böyüt / Bərpa et">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
                <rect x="2" y="2" width="8" height="8" rx="1"/>
              </svg>
            </button>
            <button type="button" id="btn-win-close" class="win-ctrl-btn win-ctrl-close" title="Bağla">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
                <line x1="2" y1="2" x2="10" y2="10"/>
                <line x1="10" y1="2" x2="2" y2="10"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Main IDE Workspace -->
      <main class="studio-workspace">
        <!-- Far-left narrow Icon Rail -->
        <nav class="studio-rail" aria-label="Əsas naviqasiya">
          <div class="rail-top">
            <button type="button" id="rail-btn-explorer" class="rail-btn active" title="Fayl ağacı">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
            </button>
            <button type="button" id="rail-btn-search" class="rail-btn" title="Axtar (Ctrl+Shift+F)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7.5"/>
                <line x1="20" y1="20" x2="16.4" y2="16.4"/>
              </svg>
            </button>
            <button type="button" id="rail-btn-models" class="rail-btn" title="Modellər">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                <polyline points="2 17 12 22 22 17"/>
                <polyline points="2 12 12 17 22 12"/>
              </svg>
            </button>
          </div>

          <div class="rail-bottom">
            <button type="button" id="rail-btn-settings" class="rail-btn" title="Tənzimləmələr">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
          </div>
        </nav>

        <!-- Left Explorer Panel -->
        <aside id="studio-left-panel" class="studio-left-panel">
          <div class="panel-header">
            <span class="panel-header-title">EXPLORER</span>
            <button type="button" id="btn-explorer-menu" class="studio-btn-icon" title="Explorer menyusu">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="5" cy="12" r="1.5"/>
                <circle cx="12" cy="12" r="1.5"/>
                <circle cx="19" cy="12" r="1.5"/>
              </svg>
            </button>
          </div>
          <div id="studio-file-tree" class="studio-file-tree"></div>
        </aside>

        <div id="resizer-left" class="resizer-v" role="separator" aria-orientation="vertical"></div>

        <!-- Center Column: Editor + Bottom Panel -->
        <section class="studio-center-column">
          <div class="studio-editor-section">
            <div id="studio-tabs-bar" class="studio-tabs-bar"></div>
            <div class="studio-editor-body">
              <div id="studio-editor-container" class="studio-editor-container"></div>
              <div id="studio-minimap-wrap" class="studio-minimap-wrap" style="display: none;">
                <canvas id="studio-minimap-canvas" class="studio-minimap-canvas"></canvas>
                <div id="studio-minimap-thumb" class="studio-minimap-thumb"></div>
              </div>
            </div>
          </div>

          <div id="resizer-bottom" class="resizer-h" role="separator" aria-orientation="horizontal"></div>

          <section id="studio-bottom-panel" class="studio-bottom-panel"></section>
        </section>

        <div id="resizer-right" class="resizer-v" role="separator" aria-orientation="vertical"></div>

        <!-- Right Panel: Mintu AI -->
        <aside id="studio-chat-container" class="studio-right-panel"></aside>
      </main>

      <!-- Bottom Status Bar -->
      <footer class="studio-statusbar">
        <div class="statusbar-left">
          <span class="status-ready-dot"></span>
          <span id="status-left-text">Hazır</span>
        </div>
        <div class="statusbar-right">
          <span id="status-language" class="status-meta-item">Plain Text</span>
          <span class="status-sep">·</span>
          <span class="status-meta-item">UTF-8</span>
          <span class="status-sep">·</span>
          <span id="status-cursor" class="status-meta-item">Ln 1, Col 1</span>
          <span class="status-sep">·</span>
          <button type="button" id="status-dataflow-btn" class="status-dataflow is-local" title="Məlumat axını statusu">
            <span class="dataflow-dot"></span>
            <span id="status-dataflow-label">Lokal</span>
          </button>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
