<!DOCTYPE html>
<html lang="en" style="background-color: #0a0e14; height: 100%; width: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mintu Studio</title>
    <link rel="stylesheet" href="/src/styles/studio.css" />
  </head>
  <body style="background-color: #0a0e14; color: #e6edf3; height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden;">
    <div id="studio-root">
      <!-- Top Toolbar -->
      <header class="studio-header">
        <div class="header-left">
          <div class="studio-logo">
            <span class="studio-logo-badge">Mintu Studio</span>
          </div>
          <div class="project-selector">
            <button id="btn-open-folder" class="studio-btn studio-btn-sm" title="Layihə qovluğunu aç">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>Qovluq Aç</span>
            </button>
            <span id="current-project-label" title="">Layihə seçilməyib</span>
            <button id="btn-close-project" class="studio-btn-icon" title="Layihəni bağla" style="display: none;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="header-right">
          <button id="btn-attach-active-file" class="studio-btn studio-btn-sm" title="Hazırda oxunan faylı çata qoş">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
            <span>Aktiv Faylı Qoş</span>
          </button>
          <button id="btn-open-settings" class="studio-btn studio-btn-sm" title="Model və API tənzimləmələri">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Model & API</span>
          </button>
        </div>
      </header>

      <!-- 3-Panel Workspace -->
      <main class="studio-workspace">
        <!-- 1. Left: Project File Tree -->
        <aside class="studio-left-panel">
          <div class="panel-header">
            <span>Explorer</span>
            <div class="panel-header-actions">
              <button id="btn-refresh-tree" class="studio-btn-icon" title="Ağacı yenilə">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="23 4 23 10 17 10"></polyline>
                  <polyline points="1 20 1 14 7 14"></polyline>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
              </button>
            </div>
          </div>
          <div id="studio-file-tree" class="studio-file-tree"></div>
        </aside>

        <!-- 2. Center: Code Viewer with Tabs -->
        <section class="studio-center-panel">
          <div id="studio-tabs-bar" class="studio-tabs-bar"></div>
          <div class="studio-editor-top-info">
            <span id="studio-active-file-path"></span>
          </div>
          <div id="studio-editor-container" class="studio-editor-container"></div>
          <div id="studio-editor-status" class="studio-editor-status">
            <span>Hazır</span>
          </div>
        </section>

        <!-- 3. Right: Agent Chat -->
        <aside class="studio-right-panel" id="studio-chat-container"></aside>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
