[package]
name = "mintu-studio"
version = "0.1.0"
description = "Mintu Studio - Standalone AI Code Workspace"
authors = ["Mintu Contributors"]
edition = "2021"

[lib]
name = "mintu_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Credentials",
] }
