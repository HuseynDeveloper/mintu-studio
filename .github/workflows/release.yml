name: Release Mintu Studio

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri NSIS Installer
        run: npx tauri build --bundles nsis

      - name: Generate latest.json with SHA-256
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "src-tauri/target"
          node scripts/prepare-release.mjs --repo "${{ github.repository }}" --notes "Mintu Studio ${{ github.ref_name }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            release/latest.json
